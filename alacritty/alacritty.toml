# Alacritty Configuration for Windows

# Theme
import = [
  "C:\\Users\\Lorran\\.config\\alacritty\\themes\\gruvbox_material.yml"
]

# Window configuration
[window]
dynamic_title = true
decorations = "full"

[window.padding]
x = 4
y = 4

# Font configuration
[font]
size = 12

[font.normal]
family = "ZedMono Nerd Font"
style = "Extended Medium"

[font.bold]
family = "ZedMono Nerd Font"
style = "Extended Bold"

[font.italic]
family = "ZedMono Nerd Font"
style = "Extended Medium Italic"

[font.bold_italic]
family = "ZedMono Nerd Font"
style = "Extended Bold Italic"

# Shell configuration
[shell]
program = "wsl.exe"
args = ["~"]  # Start in home directory, you can specify another directory here

# Cursor style
[cursor]
blink_interval = 750

[cursor.style]
shape = "Block"
blinking = "On"

# Key bindings
[keyboard]
bindings = [
  { key = "V",         mods = "Control|Shift", action = "Paste"            },
  { key = "C",         mods = "Control|Shift", action = "Copy"             },
  { key = "Insert",    mods = "Shift",         action = "PasteSelection"   },
  { key = "Key0",      mods = "Control",       action = "ResetFontSize"    },
  { key = "Equals",    mods = "Control",       action = "IncreaseFontSize" },
  { key = "Minus",     mods = "Control",       action = "DecreaseFontSize" },
]

# Misc
[selection]
save_to_clipboard = true